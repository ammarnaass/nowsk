services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: islamic_calendar_app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=mysql
      - REDIS_HOST=redis
    volumes:
      - ./:/var/www/html
    networks:
      - calendar_net

  nginx:
    image: nginx:alpine
    container_name: islamic_calendar_nginx
    restart: unless-stopped
    ports:
      - "8001:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - calendar_net

  redis:
    image: redis:7-alpine
    container_name: islamic_calendar_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - calendar_net

  mysql:
    image: mysql:8.0
    container_name: islamic_calendar_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: islamic_calendar
      MYSQL_USER: calendar_user
      MYSQL_PASSWORD: calendar_secret
      MYSQL_ROOT_PASSWORD: root_secret
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - calendar_net

networks:
  calendar_net:
    driver: bridge

volumes:
  redis_data:
  mysql_data:
